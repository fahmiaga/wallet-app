name: RND Self-Hosted Runner Test

on:
  push:
    branches: [ fahmi-rnd-self-hosted ]

jobs:
  scan_ruby:
    runs-on: [self-hosted, linux, rnd-local]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Print runner info
        run: |
          echo "Runner: $(hostname) | $(nproc) threads | $(free -h | awk '/Mem:/ {print $2}') RAM"
          echo "Ruby: $(ruby -v)"

      - name: Add rbenv Ruby to PATH
        run: |
          echo "$HOME/.rbenv/bin" >> "$GITHUB_PATH"
          echo "$HOME/.rbenv/shims" >> "$GITHUB_PATH"

      - name: Install gems (bundle install)
        run: bundle install

      - name: Brakeman (static security scan)
        run: bundle exec brakeman --no-pager --no-exit-on-warn

  lint:
    runs-on: [self-hosted, linux, rnd-local]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Add rbenv Ruby to PATH
        run: |
          echo "$HOME/.rbenv/bin" >> "$GITHUB_PATH"
          echo "$HOME/.rbenv/shims" >> "$GITHUB_PATH"

      - name: Install gems (bundle install)
        run: bundle install

      - name: RuboCop (style lint)
        run: bundle exec rubocop -f github
