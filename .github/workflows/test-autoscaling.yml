name: Test CREMA Parallel Autoscaling

on:
  push:
    branches:
      - fahmi-rnd-self-hosted
  workflow_dispatch:

jobs:
  test_parallel:
    name: Runner ${{ matrix.runner }}
    runs-on: [self-hosted, linux, x64]

    strategy:
      fail-fast: false
      matrix:
        runner: [1, 2, 3]

    steps:
      - name: Show Runner Information
        run: |
          echo "Matrix Runner: ${{ matrix.runner }}"
          echo "GitHub Runner: $RUNNER_NAME"
          echo "Hostname: $(hostname)"
          echo "Started at: $(date)"

      - name: Simulate Long Running Job
        run: |
          echo "Starting parallel job..."
          sleep 120
          echo "Finished at: $(date)"
